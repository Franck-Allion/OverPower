name: OverPower Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore OverPower.Core.sln

    - name: Compile Solution (Domain & Application)
      run: dotnet build OverPower.Core.sln --configuration Release --no-restore

    - name: Execute Core Unit Tests
      run: dotnet test OverPower.Core.sln --configuration Release --no-build
